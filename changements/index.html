<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Changements de projections — 100% Pool</title>
  <link rel="icon" type="image/png" href="../100pool.jpg">
  <meta name="description" content="Historique des changements de projections NHL 2026-27 — 100% Pool">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #f0f4f8; color: #1e293b; min-height: 100vh; }

    nav:not(#sharedSidebar) { background: linear-gradient(135deg, #1a5c28, #2d8a3e); padding: 0 32px; height: 56px; display: flex; align-items: center; gap: 14px; box-shadow: 0 2px 8px rgba(0,0,0,0.25); position: sticky; top: 0; z-index: 200; }
    .nav-logo { display: flex; align-items: center; gap: 10px; text-decoration: none; }
    .nav-logo img { width: 32px; height: 32px; border-radius: 50%; object-fit: cover; flex-shrink: 0; }
    .nav-logo span { color: white; font-weight: 800; font-size: 1.05em; }
    .nav-links { display: flex; align-items: center; gap: 6px; margin-left: auto; }
    .nav-link { color: rgba(255,255,255,0.75); text-decoration: none; font-size: 0.85em; font-weight: 600; padding: 7px 14px; border-radius: 8px; transition: all 0.2s; }
    .nav-link:hover { background: rgba(255,255,255,0.1); color: white; }
    @media (max-width: 640px) { nav:not(#sharedSidebar) { padding: 0 16px; } .nav-links { display: none; } }

    /* ── Header ── */
    .page-header { background: linear-gradient(160deg, #163d1c 0%, #1e6b2e 40%, #2d8a3e 75%, #1a7a32 100%); padding: 36px 24px 32px; }
    .page-header-inner { max-width: 820px; margin: 0 auto; }
    .page-header h1 { font-size: 1.75em; font-weight: 900; color: white; margin-bottom: 6px; letter-spacing: -0.3px; }
    .page-header p { color: rgba(255,255,255,0.65); font-size: 0.88em; }
    .header-stats { display: flex; gap: 20px; margin-top: 18px; flex-wrap: wrap; }
    .header-stat { background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.15); border-radius: 10px; padding: 10px 16px; }
    .header-stat-val { font-size: 1.3em; font-weight: 900; color: white; line-height: 1; }
    .header-stat-label { font-size: 0.68em; color: rgba(255,255,255,0.6); font-weight: 600; margin-top: 3px; text-transform: uppercase; letter-spacing: 0.5px; }

    /* ── Content ── */
    .content { max-width: 820px; margin: 0 auto; padding: 28px 16px 80px; }

    /* ── Date group ── */
    .date-group { margin-bottom: 32px; }
    .date-header { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
    .date-label { font-size: 0.72em; font-weight: 800; text-transform: uppercase; letter-spacing: 1.2px; color: #64748b; }
    .date-count { font-size: 0.68em; font-weight: 700; background: #e2e8f0; color: #64748b; border-radius: 99px; padding: 2px 8px; }

    /* ── Card ── */
    .change-card { background: white; border-radius: 14px; border: 1px solid #e2e8f0; box-shadow: 0 1px 4px rgba(0,0,0,0.05); padding: 0; margin-bottom: 8px; display: flex; align-items: stretch; overflow: hidden; transition: box-shadow 0.15s; }
    .change-card:hover { box-shadow: 0 4px 16px rgba(0,0,0,0.09); }

    .change-accent { width: 4px; flex-shrink: 0; }
    .change-accent.up { background: linear-gradient(180deg, #22c55e, #16a34a); }
    .change-accent.down { background: linear-gradient(180deg, #f87171, #dc2626); }
    .change-accent.same { background: #e2e8f0; }

    .change-body { display: flex; align-items: center; gap: 14px; padding: 14px 16px; flex: 1; min-width: 0; }

    .change-logo-wrap { position: relative; flex-shrink: 0; }
    .change-logo { width: 38px; height: 38px; object-fit: contain; }

    .change-info { flex: 1; min-width: 0; }
    .change-name { font-size: 0.93em; font-weight: 800; color: #0f172a; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .change-meta { display: flex; gap: 6px; align-items: center; margin-top: 3px; flex-wrap: wrap; }
    .change-pos { font-size: 0.68em; font-weight: 700; background: #f1f5f9; color: #64748b; border-radius: 5px; padding: 1px 6px; }
    .change-note { font-size: 0.76em; color: #64748b; line-height: 1.45; margin-top: 5px; }

    .change-right { text-align: right; flex-shrink: 0; }
    .change-pts-row { display: flex; align-items: center; gap: 6px; justify-content: flex-end; }
    .pts-old { font-size: 0.82em; font-weight: 600; color: #94a3b8; }
    .pts-arrow { color: #cbd5e1; font-size: 0.8em; }
    .pts-new { font-size: 0.92em; font-weight: 900; color: #0f172a; }
    .change-diff { display: inline-flex; align-items: center; gap: 3px; font-size: 0.72em; font-weight: 800; margin-top: 5px; padding: 2px 8px; border-radius: 99px; white-space: nowrap; }
    .change-diff.up { background: #dcfce7; color: #15803d; }
    .change-diff.down { background: #fee2e2; color: #dc2626; }
    .change-diff.same { background: #f1f5f9; color: #94a3b8; }

    .empty-state { text-align: center; padding: 80px 24px; color: #94a3b8; }
    .empty-state .empty-icon { font-size: 2.5em; margin-bottom: 12px; }
    .empty-state p { font-size: 0.9em; }
    .loading { text-align: center; padding: 64px; color: #94a3b8; font-size: 0.9em; }

    @media (max-width: 560px) {
      .change-logo { width: 30px; height: 30px; }
      .pts-old, .pts-arrow { display: none; }
      .change-body { gap: 10px; padding: 12px 12px; }
    }
  </style>
</head>
<body>

<nav>
  <a class="nav-logo" href="/">
    <img src="../100pool.jpg" alt="100% Pool">
    <span>100% Pool</span>
  </a>
  <div class="nav-links">
    <a class="nav-link" href="/guide-poolers/2026-2027/">Guide</a>
    <a class="nav-link" href="/mon-equipe/">Mon équipe</a>
  </div>
</nav>

<div class="page-header">
  <div class="page-header-inner">
    <h1>📈 Changements de projections</h1>
    <p>Mises à jour des projections pour la saison 2026-27</p>
    <div class="header-stats">
      <div class="header-stat">
        <div class="header-stat-val" id="stat-total">—</div>
        <div class="header-stat-label">Changements</div>
      </div>
      <div class="header-stat">
        <div class="header-stat-val" id="stat-up">—</div>
        <div class="header-stat-label">Hausses</div>
      </div>
      <div class="header-stat">
        <div class="header-stat-val" id="stat-down">—</div>
        <div class="header-stat-label">Baisses</div>
      </div>
    </div>
  </div>
</div>

<div class="content">
  <div id="changesList"><div class="loading">Chargement…</div></div>
</div>

<script>
const SUPABASE_URL = 'https://fifurqlitkywtmhgtzeu.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZpZnVycWxpdGt5d3RtaGd0emV1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzY3MDIyMjQsImV4cCI6MjA5MjI3ODIyNH0.KPVPj1qwbSJJMyLR_-AhDcRs0vi2sUU6qbFQ-kH53C0';
const SB_HEADERS = { 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${SUPABASE_KEY}` };

async function loadChanges() {
  const res = await fetch(
    `${SUPABASE_URL}/rest/v1/projection_changes?select=*,poolers_players(team,pos)&order=changed_at.desc`,
    { headers: SB_HEADERS }
  );
  const container = document.getElementById('changesList');
  if (!res.ok) { container.innerHTML = '<div class="empty-state"><div class="empty-icon">⚠️</div><p>Erreur de chargement.</p></div>'; return; }
  const changes = await res.json();

  if (!changes.length) {
    container.innerHTML = '<div class="empty-state"><div class="empty-icon">📋</div><p>Aucun changement enregistré pour le moment.</p></div>';
    return;
  }

  // Stats header
  const ups = changes.filter(c => c.new_pts > c.old_pts).length;
  const downs = changes.filter(c => c.new_pts < c.old_pts).length;
  document.getElementById('stat-total').textContent = changes.length;
  document.getElementById('stat-up').textContent = ups;
  document.getElementById('stat-down').textContent = downs;

  // Grouper par date
  const groups = {};
  changes.forEach(c => {
    const dKey = new Date(c.changed_at).toISOString().slice(0, 10);
    const label = new Date(c.changed_at).toLocaleDateString('fr-CA', { weekday: 'long', day: 'numeric', month: 'long' });
    if (!groups[dKey]) groups[dKey] = { label, items: [] };
    groups[dKey].items.push(c);
  });

  container.innerHTML = Object.entries(groups).map(([, group]) => {
    const items = group.items.map(c => {
      const team = c.poolers_players?.team || 'NHL';
      const pos = c.poolers_players?.pos || '';
      const diff = c.new_pts - c.old_pts;
      const diffCls = diff > 0 ? 'up' : diff < 0 ? 'down' : 'same';
      const diffLabel = diff > 0 ? `▲ +${diff} pts` : diff < 0 ? `▼ ${diff} pts` : '= inchangé';
      return `<div class="change-card">
        <div class="change-accent ${diffCls}"></div>
        <div class="change-body">
          <img class="change-logo" src="https://assets.nhle.com/logos/nhl/svg/${team}_light.svg" alt="${team}" loading="lazy">
          <div class="change-info">
            <div class="change-name">${c.player_name}</div>
            <div class="change-meta">${pos ? `<span class="change-pos">${pos}</span>` : ''}</div>
            ${c.note ? `<div class="change-note">${c.note}</div>` : ''}
          </div>
          <div class="change-right">
            <div class="change-pts-row">
              <span class="pts-old">${c.old_pts} pts</span>
              <span class="pts-arrow">→</span>
              <span class="pts-new">${c.new_pts} pts</span>
            </div>
            <div style="display:flex;justify-content:flex-end">
              <span class="change-diff ${diffCls}">${diffLabel}</span>
            </div>
          </div>
        </div>
      </div>`;
    }).join('');

    return `<div class="date-group">
      <div class="date-header">
        <span class="date-label">${group.label}</span>
        <span class="date-count">${group.items.length}</span>
      </div>
      ${items}
    </div>`;
  }).join('');
}

loadChanges();
</script>
<script src="/sidebar.js?v=16"></script>
</body>
</html>
