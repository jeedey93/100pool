<script>
const SUPABASE_URL = 'https://fifurqlitkywtmhgtzeu.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZpZnVycWxpdGt5d3RtaGd0emV1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzY3MDIyMjQsImV4cCI6MjA5MjI3ODIyNH0.KPVPj1qwbSJJMyLR_-AhDcRs0vi2sUU6qbFQ-kH53C0';
const SB_HEADERS = { 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${SUPABASE_KEY}` };

const POOL_SCORING = { fwd_g: 1, fwd_a: 1, def_g: 2, def_a: 1, g_w: 2, g_so: 3 };

function calcPoolPts(p) {
  if (p.pos === 'G') return (p.proj_g ?? 0) * POOL_SCORING.g_w + (p.proj_a ?? 0) * POOL_SCORING.g_so;
  const isD = p.pos === 'D';
  return (p.proj_g ?? 0) * (isD ? POOL_SCORING.def_g : POOL_SCORING.fwd_g)
       + (p.proj_a ?? 0) * (isD ? POOL_SCORING.def_a : POOL_SCORING.fwd_a);
}

const CAP_MAX = 104;
const LIMITS = { F: 12, D: 6, G: 2 };
const IS_FWD = pos => pos && /^(C|LW|RW|AG|AD|F)(\/.*)?$/.test(pos);
const POS_GROUP = p => IS_FWD(p.pos) ? 'F' : p.pos === 'D' ? 'D' : p.pos === 'G' ? 'G' : null;
const POS_LABEL = { F: 'Attaquants', D: 'Défenseurs', G: 'Gardiens' };

const TEAM_KEY = 'draft_assist_team';

let allPlayers = [];
let draftedIds = new Set(JSON.parse(localStorage.getItem('pool_drafted') || '[]').map(Number));
let myTeamIds = new Set(JSON.parse(localStorage.getItem(TEAM_KEY) || '[]').map(Number));
let suggestions = [];
let posFilter = 'ALL';

// ── Optimizer greedy ──────────────────────────────────────────────────────────
function optimize() {
  const locked = allPlayers.filter(p => myTeamIds.has(p.id));
  const capUsed = locked.reduce((s, p) => s + parseFloat(p.aav || 0), 0);
  let remCap = CAP_MAX - capUsed;

  const slotsNeeded = { F: LIMITS.F, D: LIMITS.D, G: LIMITS.G };
  locked.forEach(p => { const g = POS_GROUP(p); if (g && slotsNeeded[g] > 0) slotsNeeded[g]--; });

  const byGrp = { F: [], D: [], G: [] };
  allPlayers.forEach(p => {
    const g = POS_GROUP(p);
    if (!g || myTeamIds.has(p.id) || draftedIds.has(p.id)) return;
    if (!p.aav || parseFloat(p.aav) <= 0) return;
    byGrp[g].push(p);
  });

  function minCap(grp, n, excluded = new Set()) {
    return byGrp[grp]
      .filter(p => !excluded.has(p.id))
      .sort((a, b) => parseFloat(a.aav) - parseFloat(b.aav))
      .slice(0, n)
      .reduce((s, p) => s + parseFloat(p.aav), 0);
  }

  const result = [];
  const takenIds = new Set();
  const tempSlots = { ...slotsNeeded };

  // Allouer un budget cap par groupe proportionnel aux slots restants
  // puis optimiser chaque groupe dans son budget (meilleur pts pool possible)
  const totalSlots = tempSlots.F + tempSlots.D + tempSlots.G;
  const capBudget = {};
  if (totalSlots > 0) {
    // Budget initial proportionnel, mais ajusté au minimum requis par groupe
    for (const grp of ['F', 'D', 'G']) {
      capBudget[grp] = tempSlots[grp] > 0 ? (remCap * tempSlots[grp] / totalSlots) : 0;
    }
    // S'assurer que chaque groupe peut au moins prendre ses joueurs les moins chers
    for (const grp of ['F', 'D', 'G']) {
      const minNeeded = minCap(grp, tempSlots[grp]);
      if (capBudget[grp] < minNeeded) {
        const deficit = minNeeded - capBudget[grp];
        capBudget[grp] = minNeeded;
        // Réduire le surplus des autres groupes
        const others = ['F', 'D', 'G'].filter(g => g !== grp);
        for (const og of others) {
          const surplus = capBudget[og] - minCap(og, tempSlots[og]);
          const take = Math.min(deficit, Math.max(0, surplus));
          capBudget[og] -= take;
        }
      }
    }
  }

  for (const grp of ['F', 'D', 'G']) {
    if (tempSlots[grp] <= 0) continue;
    let grpCap = capBudget[grp] ?? remCap;
    const candidates = [...byGrp[grp]].sort((a, b) => calcPoolPts(b) - calcPoolPts(a));
    for (const p of candidates) {
      if (tempSlots[grp] <= 0) break;
      const aav = parseFloat(p.aav);
      // Réserver le cap minimum pour les slots restants dans ce groupe
      const excl = new Set([...takenIds, p.id]);
      const reserved = minCap(grp, tempSlots[grp] - 1, excl);
      if (aav > grpCap - reserved) continue;
      result.push(p);
      takenIds.add(p.id);
      tempSlots[grp]--;
      grpCap -= aav;
      remCap -= aav;
    }
  }

  suggestions = result;
}

function recompute() {
  optimize();
  renderTeam();
  renderPool();
  renderCapBar();
  renderRayes();
  updateSyncBadge();
}

function renderRayes() {
  const rayesPlayers = allPlayers.filter(p => draftedIds.has(p.id) && !myTeamIds.has(p.id));
  const panel = document.getElementById('rayesPanel');
  const subtitle = document.getElementById('rayesSubtitle');
  panel.style.display = '';
  if (!rayesPlayers.length) {
    subtitle.textContent = 'Aucun joueur rayé — utilise ✕ dans la liste pour rayer un adversaire';
    document.getElementById('rayesList').innerHTML = `<div style="padding:12px 8px;font-size:0.82em;color:#94a3b8;font-style:italic">Clique ✕ sur un joueur à droite pour le marquer comme repêché par un adversaire.</div>`;
    return;
  }
  subtitle.textContent = `${rayesPlayers.length} joueur${rayesPlayers.length > 1 ? 's' : ''} — cliquer ✕ pour remettre dans le pool`;
  document.getElementById('rayesList').innerHTML = rayesPlayers
    .sort((a, b) => calcPoolPts(b) - calcPoolPts(a))
    .map(p => {
      const aav = p.aav ? `${parseFloat(p.aav).toFixed(2)}M$` : 'Libre';
      const pts = p.proj_pts != null ? `${calcPoolPts(p)} pts` : '—';
      return `<div class="player-row is-drafted" style="opacity:1">
        <img class="player-logo" src="https://assets.nhle.com/logos/nhl/svg/${p.team}_light.svg" alt="${p.team}" loading="lazy">
        <div class="player-info">
          <div class="player-name" style="text-decoration:line-through;color:#94a3b8">${p.name}</div>
          <div class="player-meta">${p.team} · ${p.pos}</div>
        </div>
        <div class="player-pts" style="color:#94a3b8">${pts}</div>
        <div class="player-aav">${aav}</div>
        <button class="btn-raye active" onclick="toggleDrafted(${p.id})" title="Remettre dans le pool">✕ Dé-rayer</button>
      </div>`;
    }).join('');
}

// ── Persist ───────────────────────────────────────────────────────────────────
function saveMyTeam() {
  const prev = new Set(JSON.parse(localStorage.getItem(TEAM_KEY) || '[]'));
  localStorage.setItem(TEAM_KEY, JSON.stringify([...myTeamIds]));
  const drafted = new Set(JSON.parse(localStorage.getItem('pool_drafted') || '[]'));
  prev.forEach(id => { if (!myTeamIds.has(id)) drafted.delete(id); });
  myTeamIds.forEach(id => drafted.add(id));
  localStorage.setItem('pool_drafted', JSON.stringify([...drafted]));
  draftedIds = new Set([...drafted].map(Number));
}

// ── Actions ───────────────────────────────────────────────────────────────────
function toggleMyTeam(id) {
  if (myTeamIds.has(id)) {
    myTeamIds.delete(id);
  } else {
    myTeamIds.add(id);
    draftedIds.delete(id);
  }
  saveMyTeam();
  recompute();
}

function toggleDrafted(id) {
  if (myTeamIds.has(id)) return;
  if (draftedIds.has(id)) {
    draftedIds.delete(id);
  } else {
    draftedIds.add(id);
  }
  const drafted = new Set(JSON.parse(localStorage.getItem('pool_drafted') || '[]'));
  if (draftedIds.has(id)) drafted.add(id); else drafted.delete(id);
  localStorage.setItem('pool_drafted', JSON.stringify([...drafted]));
  draftedIds = new Set([...drafted].map(Number));
  recompute();
}

function removeMyTeam(id) {
  myTeamIds.delete(id);
  saveMyTeam();
  recompute();
}

function confirmSuggestion(id) {
  myTeamIds.add(id);
  saveMyTeam();
  recompute();
  showToast('✓ Joueur ajouté à ton équipe');
}

function syncNow() {
  draftedIds = new Set(JSON.parse(localStorage.getItem('pool_drafted') || '[]').map(Number));
  myTeamIds.forEach(id => draftedIds.delete(id));
  recompute();
  showToast('🔄 Synchronisé avec le guide');
}

function resetAll() {
  if (!confirm('Retirer tous les joueurs de ton équipe ?')) return;
  myTeamIds.clear();
  saveMyTeam();
  recompute();
  showToast('✕ Équipe réinitialisée');
}

function resetDraft() {
  if (!confirm('Dé-rayer tous les joueurs adverses ?')) return;
  const teamArr = [...myTeamIds];
  draftedIds.clear();
  teamArr.forEach(id => draftedIds.add(id));
  localStorage.setItem('pool_drafted', JSON.stringify(teamArr));
  recompute();
  showToast('✕ Rayés adverses effacés');
}

function setPos(pos, btn) {
  posFilter = pos;
  document.querySelectorAll('.pos-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  renderPool();
}

function toggleShowDrafted() {}

// ── Cap bar ───────────────────────────────────────────────────────────────────
function renderCapBar() {
  const teamIds = new Set([...myTeamIds, ...suggestions.map(p => p.id)]);
  const team = allPlayers.filter(p => teamIds.has(p.id));
  const capUsed = team.reduce((s, p) => s + parseFloat(p.aav || 0), 0);
  const totalPts = team.reduce((s, p) => s + calcPoolPts(p), 0);
  const pct = Math.min(100, (capUsed / CAP_MAX) * 100);
  const over = capUsed > CAP_MAX;

  const capEl = document.getElementById('statCap');
  capEl.textContent = `${capUsed.toFixed(2)} M$`;
  capEl.classList.toggle('over', over);
  document.getElementById('statPts').textContent = totalPts;
  const fill = document.getElementById('capBarFill');
  fill.style.width = pct + '%';
  fill.classList.toggle('over', over);

  const counts = { F: 0, D: 0, G: 0 };
  team.forEach(p => { const g = POS_GROUP(p); if (g) counts[g]++; });
  document.getElementById('slotsSummary').innerHTML = ['F', 'D', 'G'].map(g => {
    const filled = counts[g], max = LIMITS[g];
    const cls = filled > max ? 'over' : filled === max ? 'full' : 'ok';
    return `<span class="slot-chip ${cls}">${POS_LABEL[g][0]} ${filled}/${max}</span>`;
  }).join('');
}

function updateSyncBadge() {
  const allDrafted = JSON.parse(localStorage.getItem('pool_drafted') || '[]').map(Number);
  const adverses = allDrafted.filter(id => !myTeamIds.has(id));
  const badge = document.getElementById('syncBadge');
  badge.textContent = `⬤ ${adverses.length} rayés`;
  badge.style.background = adverses.length ? 'rgba(239,68,68,0.18)' : 'rgba(255,255,255,0.1)';
}

// ── Render équipe ─────────────────────────────────────────────────────────────
function renderTeam() {
  const panel = document.getElementById('teamPanel');

  let html = '';
  for (const grp of ['F', 'D', 'G']) {
    const myTeam = allPlayers.filter(p => myTeamIds.has(p.id) && POS_GROUP(p) === grp);
    const suggs = suggestions.filter(p => POS_GROUP(p) === grp);
    const total = myTeam.length + suggs.length;
    const max = LIMITS[grp];
    const empty = Math.max(0, max - total);
    const groupPts = [...myTeam, ...suggs].reduce((s, p) => s + calcPoolPts(p), 0);

    html += `<div class="group-section">
      <div class="group-header">
        <span>${POS_LABEL[grp]} ${total}/${max}</span>
        <span class="group-pts">${groupPts} pts</span>
      </div>`;

    for (const p of myTeam) html += slotHTML(p, 'myteam');
    for (const p of suggs) html += slotHTML(p, 'suggestion');
    for (let i = 0; i < empty; i++) {
      html += `<div class="team-slot slot-empty">
        <div class="slot-logo-empty"></div>
        <span class="slot-empty-label">— Slot vide</span>
      </div>`;
    }
    html += `</div>`;
  }

  panel.innerHTML = html;

  const myCount = myTeamIds.size, sugg = suggestions.length;
  document.getElementById('teamSubtitle').textContent =
    `${myCount} joueur${myCount !== 1 ? 's' : ''} · ${sugg} suggestion${sugg !== 1 ? 's' : ''}`;
}

function slotHTML(p, type) {
  const aav = p.aav ? `${parseFloat(p.aav).toFixed(2)}M$` : 'Libre';
  const pts = p.proj_pts != null ? `${calcPoolPts(p)} pts` : '—';
  const badgeLabel = type === 'myteam' ? 'Mon équipe' : 'Suggéré';
  const badgeCls = type === 'myteam' ? 'badge-myteam' : 'badge-suggest';
  const slotCls = type === 'myteam' ? 'slot-myteam' : 'slot-suggestion';
  const confirmBtn = type === 'suggestion'
    ? `<button class="slot-confirm-btn" onclick="confirmSuggestion(${p.id})">✓ Confirmer</button>` : '';
  const removeBtn = type === 'myteam'
    ? `<button class="slot-remove" onclick="removeMyTeam(${p.id})" title="Retirer">✕</button>` : '';

  return `<div class="team-slot ${slotCls}">
    <img class="slot-logo" src="https://assets.nhle.com/logos/nhl/svg/${p.team}_light.svg" alt="${p.team}" loading="lazy">
    <div class="slot-info">
      <div class="slot-name">${p.name}</div>
      <div class="slot-meta">${p.team} · ${p.pos} · ${aav}</div>
    </div>
    <div class="slot-pts">${pts}</div>
    <span class="slot-badge ${badgeCls}">${badgeLabel}</span>
    ${confirmBtn}${removeBtn}
  </div>`;
}

// ── Render pool joueurs ───────────────────────────────────────────────────────
function renderPool() {
  const q = (document.getElementById('poolSearch').value || '').toLowerCase().trim();
  const suggIds = new Set(suggestions.map(p => p.id));

  let list = allPlayers.filter(p => {
    if (posFilter !== 'ALL' && POS_GROUP(p) !== posFilter) return false;
    if (draftedIds.has(p.id) && !myTeamIds.has(p.id)) return false;
    if (q && !p.name.toLowerCase().includes(q) && !p.team.toLowerCase().includes(q)) return false;
    return true;
  });

  list.sort((a, b) => {
    const rankA = myTeamIds.has(a.id) ? 0 : suggIds.has(a.id) ? 1 : draftedIds.has(a.id) ? 3 : 2;
    const rankB = myTeamIds.has(b.id) ? 0 : suggIds.has(b.id) ? 1 : draftedIds.has(b.id) ? 3 : 2;
    if (rankA !== rankB) return rankA - rankB;
    return calcPoolPts(b) - calcPoolPts(a);
  });

  if (!list.length) {
    document.getElementById('playerList').innerHTML = `<div class="empty-state">Aucun joueur trouvé</div>`;
    return;
  }

  const html = list.map(p => {
    const isMyTeam = myTeamIds.has(p.id);
    const isSugg = suggIds.has(p.id);
    const isDrafted = draftedIds.has(p.id);

    let rowCls = 'player-row';
    if (isMyTeam) rowCls += ' is-myteam';
    else if (isSugg) rowCls += ' is-suggested';
    else if (isDrafted) rowCls += ' is-drafted';

    const aav = p.aav ? `${parseFloat(p.aav).toFixed(2)}M$` : 'Libre';
    const pts = p.proj_pts != null ? `${calcPoolPts(p)}` : '—';
    const suggTag = isSugg && !isMyTeam ? `<span class="suggest-tag">✨ Suggéré</span>` : '';

    return `<div class="${rowCls}">
      <img class="player-logo" src="https://assets.nhle.com/logos/nhl/svg/${p.team}_light.svg" alt="${p.team}" loading="lazy">
      <div class="player-info">
        <div class="player-name">${p.name}</div>
        <div class="player-meta">${p.team} · ${p.pos}</div>
      </div>
      <div class="player-pts">${pts} pts</div>
      <div class="player-aav">${aav}</div>
      ${suggTag}
      <div class="player-actions">
        <button class="btn-myteam${isMyTeam ? ' active' : ''}" onclick="toggleMyTeam(${p.id})" title="Mon équipe">✓</button>
        <button class="btn-raye${isDrafted && !isMyTeam ? ' active' : ''}" onclick="toggleDrafted(${p.id})" title="Rayé" ${isMyTeam ? 'disabled' : ''}>✕</button>
      </div>
    </div>`;
  }).join('');

  document.getElementById('playerList').innerHTML = html;
}

// ── Toast ─────────────────────────────────────────────────────────────────────
function showToast(msg) {
  const t = document.getElementById('daToast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(t._t);
  t._t = setTimeout(() => t.classList.remove('show'), 2800);
}

// ── Cross-tab sync ────────────────────────────────────────────────────────────
window.addEventListener('storage', e => {
  if (e.key === 'pool_drafted') {
    draftedIds = new Set(JSON.parse(e.newValue || '[]').map(Number));
    myTeamIds.forEach(id => draftedIds.delete(id));
    recompute();
    showToast('🔄 Disponibilité mise à jour');
  }
});

// ── Init ──────────────────────────────────────────────────────────────────────
async function init() {
  const res = await fetch(
    `${SUPABASE_URL}/rest/v1/poolers_players?order=proj_pts.desc&select=id,name,team,pos,aav,proj_pts,proj_g,proj_a,tier`,
    { headers: SB_HEADERS }
  );
  if (!res.ok) {
    document.getElementById('teamPanel').innerHTML = `<div class="empty-state">Erreur de chargement. Recharge la page.</div>`;
    return;
  }
  allPlayers = await res.json();
  allPlayers.forEach(p => {
    if (p.pos === 'G') p.proj_pts = (p.proj_g || 0) * 2 + (p.proj_a || 0) * 3;
  });

  myTeamIds.forEach(id => { if (!allPlayers.find(p => p.id === id)) myTeamIds.delete(id); });

  recompute();
}

init();
</script>
